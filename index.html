<!DOCTYPE html>
<html>

<head>

    <title>Food Delivery Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .main-container{
            width:900px;
            display:flex;
            gap:20px;
        }

        .container,
        .result-panel{

            background:#1e293b;
            padding:25px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.4);

        }

        .container{
            width:55%;
        }

        .result-panel{
            width:45%;
        }

        h1{
            text-align:center;
            color:#38bdf8;
            margin-bottom:25px;
            font-size:38px;
        }

        h2{
            text-align:center;
            color:#38bdf8;
            margin-bottom:20px;
            font-size:30px;
        }

        label{
            color:white;
            font-size:16px;
            font-weight:bold;
            display:block;
            margin-bottom:8px;
            margin-top:14px;
        }

        input,
        select{

            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#334155;
            color:white;
            font-size:15px;
            outline:none;

        }

        button{

            width:100%;
            padding:14px;
            margin-top:22px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            color:#0f172a;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;

        }

        button:hover{
            background:#0ea5e9;
        }

        .box{

            background:#334155;
            padding:20px;
            border-radius:12px;
            margin-top:15px;
            text-align:center;

        }

        .box h3{
            color:#cbd5e1;
            margin-bottom:10px;
            font-size:18px;
        }

        .box p{
            color:#38bdf8;
            font-size:32px;
            font-weight:bold;
        }

        .footer{

            text-align:center;
            margin-top:20px;
            color:#94a3b8;
            font-size:12px;

        }

    </style>

</head>

<body>

    <div class="main-container">

        <div class="container">

            <h1>Food Delivery Prediction</h1>

            <form method="POST">

                <label>Delivery Distance (km)</label>

                <input 
                    type="number" 
                    step="0.1" 
                    name="distance"
                    value="{{ request.form.distance }}" 
                    required
                >

                <label>Delivery Partner Rating</label>

                <input 
                    type="number" 
                    step="0.1" 
                    name="rating"
                    value="{{ request.form.rating }}" 
                    required
                >

                <label>Weather Condition</label>

                <select name="weather">

                    <option value="Clear"
                    {% if request.form.get("weather") == "Clear" %}
                    selected
                    {% endif %}>
                    Clear
                    </option>

                    <option value="Cloudy"
                    {% if request.form.get("weather") == "Cloudy" %}
                    selected
                    {% endif %}>
                    Cloudy
                    </option>

                    <option value="Rain"
                    {% if request.form.get("weather") == "Rain" %}
                    selected
                    {% endif %}>
                    Rain
                    </option>

                </select>

                <label>Traffic Condition</label>

                <select name="traffic">

                    <option value="Low"
                    {% if request.form.get("traffic") == "Low" %}
                    selected
                    {% endif %}>
                    Low
                    </option>

                    <option value="Medium"
                    {% if request.form.get("traffic") == "Medium" %}
                    selected
                    {% endif %}>
                    Medium
                    </option>

                    <option value="High"
                    {% if request.form.get("traffic") == "High" %}
                    selected
                    {% endif %}>
                    High
                    </option>

                </select>

                <label>Peak Hour</label>

                <select name="peak">

                    <option value="Yes"
                    {% if request.form.get("peak") == "Yes" %}
                    selected
                    {% endif %}>
                    Yes
                    </option>

                    <option value="No"
                    {% if request.form.get("peak") == "No" %}
                    selected
                    {% endif %}>
                    No
                    </option>

                </select>

                <label>Food Type</label>

                <select name="food">

                    <option value="Pizza"
                    {% if request.form.get("food") == "Pizza" %}
                    selected
                    {% endif %}>
                    Pizza
                    </option>

                    <option value="Snack"
                    {% if request.form.get("food") == "Snack" %}
                    selected
                    {% endif %}>
                    Snack
                    </option>

                    <option value="Biryani"
                    {% if request.form.get("food") == "Biryani" %}
                    selected
                    {% endif %}>
                    Biryani
                    </option>

                    <option value="Burger"
                    {% if request.form.get("food") == "Burger" %}
                    selected
                    {% endif %}>
                    Burger
                    </option>

                </select>

                <button type="submit">

                    Predict Delivery Time

                </button>

            </form>

            <div class="footer">

                Intelligent Food Delivery Prediction System using Machine Learning

            </div>

        </div>

        {% if eta %}

        <div class="result-panel">

            <h2>Prediction Result</h2>

            <div class="box">

                <h3>Estimated Delivery Time</h3>

                <p>{{ eta }} Min</p>

            </div>

            <div class="box">

                <h3>Delay Risk</h3>

                <p>{{ risk }}</p>

            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
